<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=https://markdown2pdf.gitlab.io/" />
    <link rel="canonical" href="https://markdown2pdf.gitlab.io/" />
    <title>md2pdf has moved</title>
    <script>
      // This host used to serve the PWA, so returning visitors are still
      // controlled by its service worker and would never see this page.
      if (navigator.serviceWorker)
        navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
      if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
      location.replace('https://markdown2pdf.gitlab.io' + location.pathname + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>md2pdf has moved to <a href="https://markdown2pdf.gitlab.io/">markdown2pdf.gitlab.io</a>.</p>
  </body>
</html>
